<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AgendAqui</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style> body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; } </style>
</head>
<body class="bg-slate-100">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

// ---- Camada de API (mesmo dominio: /api) ----
const API = "/api";

function getSlug() {
  const seg = window.location.pathname.split("/").filter(Boolean);
  return seg[0] || null;
}
const slug = getSlug();
const tokenKey = "agendaqui_token_" + (slug || "_root");

async function api(path, opts = {}) {
  const { method = "GET", body, token } = opts;
  const headers = { Accept: "application/json" };
  if (body) headers["Content-Type"] = "application/json";
  if (token) headers["Authorization"] = "Bearer " + token;
  const res = await fetch(API + path, {
    method,
    headers,
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    const err = new Error((data && data.message) || ("Erro " + res.status));
    err.status = res.status;
    throw err;
  }
  return data;
}

// ---- Tela: sem slug na URL ----
function NoSlug() {
  const [s, setS] = useState("");
  return (
    <div className="min-h-screen flex items-center justify-center p-4">
      <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 w-full max-w-md text-center">
        <div className="w-12 h-12 rounded-xl bg-blue-600 text-white flex items-center justify-center mx-auto mb-4 text-xl font-bold">A</div>
        <h1 className="text-lg font-semibold text-slate-800">AgendAqui</h1>
        <p className="text-sm text-slate-500 mt-1 mb-5">Informe o endereço do seu ambiente para acessar.</p>
        <div className="flex items-stretch border border-slate-300 rounded-lg overflow-hidden mb-3">
          <span className="flex items-center px-3 text-sm text-slate-400 bg-slate-50 border-r border-slate-200">/</span>
          <input value={s} onChange={(e)=>setS(e.target.value.toLowerCase().replace(/[^a-z0-9-]/g,""))} placeholder="seu-ambiente"
            className="flex-1 px-3 py-2.5 text-sm focus:outline-none" />
        </div>
        <button onClick={()=>{ if(s) window.location.pathname = "/" + s; }}
          className="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2.5 rounded-lg transition-colors">
          Acessar
        </button>
      </div>
    </div>
  );
}

// ---- Tela: carregando ----
function Splash() {
  return (
    <div className="min-h-screen flex items-center justify-center">
      <div className="text-slate-400 text-sm">Carregando…</div>
    </div>
  );
}

// ---- Tela: login ----
function Login({ slug, onLogged }) {
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  async function submit() {
    if (!username || !password) { setError("Preencha usuário e senha."); return; }
    setError(""); setLoading(true);
    try {
      const r = await api("/login", { method: "POST", body: { username, password, tenant: slug } });
      localStorage.setItem(tokenKey, r.token);
      onLogged(r.token, r.user);
    } catch (e) {
      if (e.status === 422 || e.status === 401) setError("Usuário ou senha inválidos.");
      else setError(e.message || "Não foi possível entrar.");
    } finally { setLoading(false); }
  }

  return (
    <div className="min-h-screen flex items-center justify-center p-4">
      <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 w-full max-w-sm">
        <div className="text-center mb-6">
          <div className="w-12 h-12 rounded-xl bg-blue-600 text-white flex items-center justify-center mx-auto mb-3 text-xl font-bold">A</div>
          <h1 className="text-lg font-semibold text-slate-800">AgendAqui</h1>
          <p className="text-sm text-slate-500 mt-1">Ambiente <span className="font-medium text-slate-700">{slug}</span></p>
        </div>

        {error && <div className="bg-red-50 text-red-700 text-sm rounded-lg px-3 py-2 mb-4">{error}</div>}

        <label className="block text-sm text-slate-600 mb-1.5">Usuário</label>
        <input value={username} onChange={(e)=>setUsername(e.target.value)} autoFocus
          className="w-full px-3 py-2.5 text-sm border border-slate-300 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500" />

        <label className="block text-sm text-slate-600 mb-1.5">Senha</label>
        <input type="password" value={password} onChange={(e)=>setPassword(e.target.value)}
          onKeyDown={(e)=>{ if(e.key==="Enter") submit(); }}
          className="w-full px-3 py-2.5 text-sm border border-slate-300 rounded-lg mb-5 focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500" />

        <button onClick={submit} disabled={loading}
          className="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white text-sm font-medium py-2.5 rounded-lg transition-colors">
          {loading ? "Entrando…" : "Entrar"}
        </button>
      </div>
    </div>
  );
}

// ---- Tela: dashboard (placeholder que prova a API) ----
function Dashboard({ token, user, slug, onLogout }) {
  const [status, setStatus] = useState("carregando serviços…");

  useEffect(() => {
    api("/services", { token })
      .then((s) => {
        const n = Array.isArray(s) ? s.length : (s && Array.isArray(s.data) ? s.data.length : 0);
        setStatus(n + " serviço(s) carregado(s) da API");
      })
      .catch(() => setStatus("não foi possível carregar serviços"));
  }, []);

  return (
    <div className="min-h-screen">
      <header className="bg-white border-b border-slate-200">
        <div className="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
          <div className="flex items-center gap-2">
            <div className="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold">A</div>
            <span className="font-semibold text-slate-800">AgendAqui</span>
            <span className="text-xs text-slate-400 border border-slate-200 rounded px-1.5 py-0.5">{slug}</span>
          </div>
          <button onClick={onLogout} className="text-sm text-slate-500 hover:text-slate-800">Sair</button>
        </div>
      </header>

      <main className="max-w-3xl mx-auto px-4 py-8">
        <div className="bg-white rounded-2xl border border-slate-200 p-6">
          <h2 className="text-lg font-semibold text-slate-800">Bem-vindo, {user.name}!</h2>
          <p className="text-sm text-slate-500 mt-1">Perfil: {user.role}</p>

          <div className="mt-5 bg-emerald-50 border border-emerald-200 rounded-lg px-4 py-3">
            <p className="text-sm text-emerald-800 font-medium">✓ Conexão com a API funcionando</p>
            <p className="text-xs text-emerald-700 mt-0.5">{status}</p>
          </div>

          <p className="text-sm text-slate-500 mt-6">
            Esta é a base do novo frontend, já autenticada por token e ligada ao backend multi-tenant.
            As próximas telas (agendamentos, serviços, financeiro) serão construídas a partir daqui.
          </p>
        </div>
      </main>
    </div>
  );
}

// ---- App raiz ----
function App() {
  const [token, setToken] = useState(() => localStorage.getItem(tokenKey));
  const [user, setUser] = useState(null);
  const [booting, setBooting] = useState(!!localStorage.getItem(tokenKey));

  useEffect(() => {
    if (token) {
      api("/me", { token })
        .then((u) => { setUser(u); setBooting(false); })
        .catch(() => { localStorage.removeItem(tokenKey); setToken(null); setBooting(false); });
    }
  }, []);

  if (!slug) return <NoSlug />;
  if (booting) return <Splash />;
  if (!token || !user) return <Login slug={slug} onLogged={(t, u) => { setToken(t); setUser(u); }} />;

  return (
    <Dashboard
      token={token}
      user={user}
      slug={slug}
      onLogout={() => {
        api("/logout", { method: "POST", token }).catch(() => {});
        localStorage.removeItem(tokenKey);
        setToken(null);
        setUser(null);
      }}
    />
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
