<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AgendAqui</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style> body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; } </style>
</head>
<body class="bg-slate-100">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

const API = "/api";
function getSlug() { return window.location.pathname.split("/").filter(Boolean)[0] || null; }
const slug = getSlug();
const tokenKey = "agendaqui_token_" + (slug || "_root");
const brl = (n) => Number(n || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
function todayStr() { const d = new Date(); const p=(n)=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function fileToDataURL(file, max) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        const m = max || 1000;
        if (width > m || height > m) { const r = Math.min(m/width, m/height); width = Math.round(width*r); height = Math.round(height*r); }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", 0.7));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function endTime(t, mins){ if(!t) return ''; const q=t.split(':'); const tot=(+q[0])*60+(+q[1])+(mins||0); const p=(n)=>String(n).padStart(2,'0'); return p(Math.floor(tot/60)%24)+':'+p(tot%60); }
function waLink(phone, text) { let d=(phone||"").replace(/\D/g,""); if(d.length<=11) d="55"+d; return "https://wa.me/"+d+"?text="+encodeURIComponent(text||""); }
const STATUS = {
  aguardando: { label:"Aguardando", cls:"bg-amber-50 text-amber-700 border-amber-200" },
  andamento:  { label:"Em andamento", cls:"bg-blue-50 text-blue-700 border-blue-200" },
  concluido:  { label:"Concluído", cls:"bg-emerald-50 text-emerald-700 border-emerald-200" },
  cancelado:  { label:"Cancelado", cls:"bg-slate-100 text-slate-500 border-slate-200" },
};

async function api(path, opts = {}) {
  const { method = "GET", body, token } = opts;
  const headers = { Accept: "application/json" };
  if (body) headers["Content-Type"] = "application/json";
  if (token) headers["Authorization"] = "Bearer " + token;
  const res = await fetch(API + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  let data = null; try { data = await res.json(); } catch (e) {}
  if (!res.ok) { const err = new Error((data && data.message) || ("Erro " + res.status)); err.status = res.status; err.data = data; throw err; }
  return data;
}
function firstError(e, fallback) {
  if (e && e.data && e.data.errors) { const k = Object.keys(e.data.errors)[0]; if (k) return e.data.errors[k][0]; }
  return (e && e.message) || fallback;
}

// ---------- UI base ----------
function Modal({ title, onClose, children, wide }) {
  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50" onClick={(e)=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className={"bg-white rounded-2xl w-full " + (wide?"max-w-lg":"max-w-md") + " p-6 shadow-xl max-h-[90vh] overflow-y-auto"}>
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-lg font-semibold text-slate-800">{title}</h3>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">×</button>
        </div>
        {children}
      </div>
    </div>
  );
}
const inputCls = "w-full px-3 py-2.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500";
const btnPrimary = "bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white text-sm font-medium px-4 py-2.5 rounded-lg transition-colors";
const btnGhost = "text-sm border border-slate-200 hover:bg-slate-50 text-slate-700 px-4 py-2.5 rounded-lg";
function CurrencyInput({ value, onChange, className }) {
  const display = (value === "" || value == null) ? "" : Number(value).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return <input value={display} inputMode="numeric" placeholder="0,00" onChange={(e)=>{ const d=e.target.value.replace(/[^0-9]/g,""); onChange(d ? parseInt(d,10)/100 : ""); }} className={className} />;
}

// ---------- Entrada ----------
function NoSlug() {
  const [s, setS] = useState("");
  return (
    <div className="min-h-screen flex items-center justify-center p-4">
      <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 w-full max-w-md text-center">
        <div className="w-12 h-12 rounded-xl bg-blue-600 text-white flex items-center justify-center mx-auto mb-4 text-xl font-bold">A</div>
        <h1 className="text-lg font-semibold text-slate-800">AgendAqui</h1>
        <p className="text-sm text-slate-500 mt-1 mb-5">Informe o endereço do seu ambiente.</p>
        <div className="flex items-stretch border border-slate-300 rounded-lg overflow-hidden mb-3">
          <span className="flex items-center px-3 text-sm text-slate-400 bg-slate-50 border-r border-slate-200">/</span>
          <input value={s} onChange={(e)=>setS(e.target.value.toLowerCase().replace(/[^a-z0-9-]/g,""))} placeholder="seu-ambiente" className="flex-1 px-3 py-2.5 text-sm focus:outline-none" />
        </div>
        <button onClick={()=>{ if(s) window.location.pathname="/"+s; }} className={btnPrimary + " w-full"}>Acessar</button>
      </div>
    </div>
  );
}
function Splash() { return <div className="min-h-screen flex items-center justify-center"><div className="text-slate-400 text-sm">Carregando…</div></div>; }

function Login({ slug, onLogged }) {
  const [username, setU] = useState(""); const [password, setP] = useState("");
  const [loading, setL] = useState(false); const [error, setE] = useState("");
  async function submit() {
    if (!username || !password) { setE("Preencha usuário e senha."); return; }
    setE(""); setL(true);
    try { const r = await api("/login", { method:"POST", body:{ username, password, tenant: slug } });
      localStorage.setItem(tokenKey, r.token); onLogged(r.token, r.user);
    } catch (e) { setE(e.status===422||e.status===401 ? "Usuário ou senha inválidos." : firstError(e,"Não foi possível entrar.")); }
    finally { setL(false); }
  }
  return (
    <div className="min-h-screen flex items-center justify-center p-4">
      <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 w-full max-w-sm">
        <div className="text-center mb-6">
          <div className="w-12 h-12 rounded-xl bg-blue-600 text-white flex items-center justify-center mx-auto mb-3 text-xl font-bold">A</div>
          <h1 className="text-lg font-semibold text-slate-800">AgendAqui</h1>
          <p className="text-sm text-slate-500 mt-1">Ambiente <span className="font-medium text-slate-700">{slug}</span></p>
        </div>
        {error && <div className="bg-red-50 text-red-700 text-sm rounded-lg px-3 py-2 mb-4">{error}</div>}
        <label className="block text-sm text-slate-600 mb-1.5">Usuário</label>
        <input value={username} onChange={(e)=>setU(e.target.value)} autoFocus className={inputCls + " mb-4"} />
        <label className="block text-sm text-slate-600 mb-1.5">Senha</label>
        <input type="password" value={password} onChange={(e)=>setP(e.target.value)} onKeyDown={(e)=>{ if(e.key==="Enter") submit(); }} className={inputCls + " mb-5"} />
        <button onClick={submit} disabled={loading} className={btnPrimary + " w-full"}>{loading ? "Entrando…" : "Entrar"}</button>
      </div>
    </div>
  );
}

// ---------- Layout ----------
function Layout({ user, slug, page, setPage, onLogout, children }) {
  const nav = [
    { id:"agendamentos", label:"Agendamentos" },
    ...(user.role==="admin" ? [{ id:"colaboradores", label:"Colaboradores" }, { id:"financeiro", label:"Financeiro" }] : []),
    { id:"servicos", label:"Serviços" },
    { id:"tipos", label:"Tipos de automóveis" },
  ];
  return (
    <div className="min-h-screen">
      <header className="bg-white border-b border-slate-200 sticky top-0 z-40">
        <div className="max-w-4xl mx-auto px-4">
          <div className="flex items-center justify-between h-14">
            <div className="flex items-center gap-2">
              <div className="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold">A</div>
              <span className="font-semibold text-slate-800">AgendAqui</span>
              <span className="text-xs text-slate-400 border border-slate-200 rounded px-1.5 py-0.5">{slug}</span>
            </div>
            <div className="flex items-center gap-3">
              <span className="text-sm text-slate-500 hidden sm:inline">{user.name}</span>
              <button onClick={onLogout} className="text-sm text-slate-500 hover:text-slate-800">Sair</button>
            </div>
          </div>
          <nav className="flex gap-1 -mb-px overflow-x-auto">
            {nav.map((n)=>(
              <button key={n.id} onClick={()=>setPage(n.id)}
                className={"px-3 py-2 text-sm whitespace-nowrap border-b-2 " + (page===n.id ? "border-blue-600 text-blue-700 font-medium" : "border-transparent text-slate-500 hover:text-slate-800")}>
                {n.label}
              </button>
            ))}
          </nav>
        </div>
      </header>
      <main className="max-w-4xl mx-auto px-4 py-6">{children}</main>
    </div>
  );
}

// ---------- WhatsApp ----------
function WhatsApp({ wa, onClose }) {
  return (
    <Modal title="Mensagem para o cliente" onClose={onClose}>
      <textarea readOnly value={wa.text} rows={6} className={inputCls + " mb-4 resize-none"} />
      <div className="flex justify-end gap-2">
        <button onClick={()=>{ navigator.clipboard && navigator.clipboard.writeText(wa.text); }} className={btnGhost}>Copiar</button>
        <a href={waLink(wa.phone, wa.text)} target="_blank" rel="noreferrer" className={btnPrimary + " inline-block"}>Abrir no WhatsApp</a>
      </div>
    </Modal>
  );
}

// ---------- Agendamentos ----------
function PhotosModal({ token, appt, onClose }) {
  const [photos, setPhotos] = useState(null);
  useEffect(()=>{ api("/appointments/"+appt.id, { token }).then(r=>setPhotos(r.photos||[])).catch(()=>setPhotos([])); }, []);
  return (
    <Modal title="Fotos do veículo" onClose={onClose} wide>
      {photos===null ? <div className="text-slate-400 text-sm">Carregando...</div> : (
        photos.length===0 ? <div className="text-slate-400 text-sm">Nenhuma foto.</div> : (
          <div className="grid grid-cols-3 gap-2">
            {photos.map(p=><img key={p.id} src={p.data} className="w-full h-28 object-cover rounded-lg border border-slate-200" />)}
          </div>
        )
      )}
    </Modal>
  );
}
function Agendamentos({ token, user }) {
  const isAdmin = user.role === "admin";
  const [date, setDate] = useState(todayStr());
  const [list, setList] = useState(null);
  const [services, setServices] = useState([]);
  const [collabs, setCollabs] = useState([]);
  const [vtypes, setVtypes] = useState([]);
  const [error, setError] = useState("");
  const [editing, setEditing] = useState(null);     // null | 'new' | appt
  const [completing, setCompleting] = useState(null); // null | appt
  const [wa, setWa] = useState(null);
  const [viewingPhotos, setViewingPhotos] = useState(null);

  async function loadBase() {
    try {
      const [s, c, v] = await Promise.all([api("/services",{token}), api("/collaborators",{token}), api("/vehicle-types",{token})]);
      setServices(s); setCollabs(c); setVtypes(v);
    } catch (e) {}
  }
  async function load() {
    setError("");
    try {
      const r = await api("/appointments?from=" + date + "&to=" + date, { token });
      r.sort((a,b)=> (a.scheduled_at||"").localeCompare(b.scheduled_at||""));
      setList(r);
    } catch (e) { setError(firstError(e,"Erro ao carregar.")); setList([]); }
  }
  useEffect(()=>{ loadBase(); }, []);
  useEffect(()=>{ setList(null); load(); }, [date]);

  async function start(a){ try{ await api("/appointments/"+a.id+"/start",{method:"POST",token}); load(); }catch(e){ alert(firstError(e,"Erro.")); } }
  async function cancel(a){ if(!window.confirm("Cancelar o agendamento de "+a.owner_name+"?")) return; try{ await api("/appointments/"+a.id+"/cancel",{method:"POST",token}); load(); }catch(e){ alert(firstError(e,"Erro.")); } }
  async function remove(a){ if(!window.confirm("Excluir definitivamente este agendamento?")) return; try{ await api("/appointments/"+a.id,{method:"DELETE",token}); load(); }catch(e){ alert(firstError(e,"Erro.")); } }

  return (
    <div>
      <div className="flex items-center justify-between mb-4 gap-3 flex-wrap">
        <h2 className="text-lg font-semibold text-slate-800">Agendamentos</h2>
        <div className="flex items-center gap-2">
          <input type="date" value={date} onChange={(e)=>setDate(e.target.value)} className={inputCls + " w-auto"} />
          <button onClick={()=>setEditing("new")} className={btnPrimary}>+ Novo</button>
        </div>
      </div>
      {error && <div className="bg-red-50 text-red-700 text-sm rounded-lg px-3 py-2 mb-4">{error}</div>}
      {list === null ? <div className="text-slate-400 text-sm">Carregando…</div> : (
        <div className="space-y-3">
          {list.length === 0 && <div className="bg-white rounded-2xl border border-slate-200 px-4 py-10 text-center text-sm text-slate-400">Nenhum agendamento neste dia.</div>}
          {list.map((a)=>(
            <ApptCard key={a.id} a={a} isAdmin={isAdmin}
              onStart={()=>start(a)} onComplete={()=>setCompleting(a)} onCancel={()=>cancel(a)}
              onEdit={()=>setEditing(a)} onRemove={()=>remove(a)} onPhotos={()=>setViewingPhotos(a)} />
          ))}
        </div>
      )}

      {editing && <ApptForm token={token} services={services} vtypes={vtypes} appt={editing==="new"?null:editing} defaultDate={date}
        onClose={()=>setEditing(null)} onSaved={(res)=>{ setEditing(null); if(res && res.whatsapp) setWa(res.whatsapp); load(); }} />}
      {completing && <CompleteModal token={token} appt={completing} collabs={collabs}
        onClose={()=>setCompleting(null)} onDone={(res)=>{ setCompleting(null); if(res && res.whatsapp) setWa(res.whatsapp); load(); }} />}
      {wa && <WhatsApp wa={wa} onClose={()=>setWa(null)} />}
      {viewingPhotos && <PhotosModal token={token} appt={viewingPhotos} onClose={()=>setViewingPhotos(null)} />}
    </div>
  );
}

function ApptCard({ a, isAdmin, onStart, onComplete, onCancel, onEdit, onRemove, onPhotos }) {
  const st = STATUS[a.status] || STATUS.aguardando;
  const dim = a.status === "cancelado";
  return (
    <div className={"bg-white rounded-2xl border border-slate-200 p-4 " + (dim?"opacity-60":"")}>
      <div className="flex items-start gap-3">
        <div className="text-center w-14 shrink-0">
          <div className="text-lg font-semibold text-slate-800">{a.time}</div>
          <div className="text-xs text-slate-400">{a.duration}min</div>
        </div>
        <div className="flex-1 min-w-0">
          <div className="flex items-center gap-2 flex-wrap">
            <span className="text-sm font-medium text-slate-800">{a.owner_name}</span>
            <span className={"text-xs px-2 py-0.5 rounded-full border " + st.cls}>{st.label}</span>
            {a.is_late && <span className="text-xs px-2 py-0.5 rounded-full bg-red-50 text-red-600 border border-red-200">atrasado</span>}
          </div>
          <div className="text-xs text-slate-400 mt-0.5">
            {a.phone}{a.plate ? " · " + a.plate : ""}{a.model ? " · " + a.model : ""}
          </div>
          <div className="text-sm text-slate-600 mt-1">{(a.services||[]).map(s=>s.name).join(", ")}</div>
          <div className="text-sm font-medium text-slate-800 mt-1">{brl(a.value)}{a.photos && a.photos.length>0 && <button onClick={onPhotos} className="ml-2 text-xs font-normal text-blue-600 hover:underline">Fotos ({a.photos.length})</button>}
            {a.status==="concluido" && a.collaborator ? <span className="text-xs font-normal text-slate-400"> · {a.collaborator.name}</span> : null}
          </div>
        </div>
      </div>
      {a.status !== "concluido" && a.status !== "cancelado" && (
        <div className="flex flex-wrap gap-2 mt-3 pt-3 border-t border-slate-100">
          {a.status === "aguardando" && <button onClick={onStart} className="text-sm bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg">Iniciar</button>}
          {a.status === "andamento" && <button onClick={onComplete} className="text-sm bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg">Concluir</button>}
          <button onClick={onEdit} className="text-sm border border-slate-200 hover:bg-slate-50 text-slate-700 px-3 py-1.5 rounded-lg">Editar</button>
          <button onClick={onCancel} className="text-sm border border-slate-200 hover:bg-slate-50 text-slate-600 px-3 py-1.5 rounded-lg">Cancelar</button>
          
          {isAdmin && <button onClick={onRemove} className="text-sm text-red-600 hover:underline px-2 py-1.5">Excluir</button>}
        </div>
      )}
    </div>
  );
}

function ApptForm({ token, services, vtypes, appt, defaultDate, onClose, onSaved }) {
  const [owner, setOwner] = useState(appt ? appt.owner_name : "");
  const [phone, setPhone] = useState(appt ? appt.phone : "");
  const [plate, setPlate] = useState(appt && appt.plate ? appt.plate : "");
  const [model, setModel] = useState(appt && appt.model ? appt.model : "");
  const [vt, setVt] = useState(appt && appt.vehicle_type_id ? String(appt.vehicle_type_id) : "");
  const [date, setDate] = useState(appt ? appt.date : defaultDate);
  const [time, setTime] = useState(appt ? appt.time : "08:00");
  const [ids, setIds] = useState(appt ? (appt.services||[]).map(s=>s.id) : []);
  const [saving, setSaving] = useState(false); const [error, setError] = useState("");
  const [conflict, setConflict] = useState(null);
  const [photos, setPhotos] = useState([]);
  async function addPhotos(files){ const arr=[]; for(const fl of Array.from(files)){ arr.push(await fileToDataURL(fl, 1000)); } setPhotos(p=>[...p, ...arr]); }

  const filtered = vt ? services.filter(s=> String(s.vehicle_type_id)===vt || !s.vehicle_type_id) : services;
  const total = services.filter(s=>ids.includes(s.id)).reduce((t,s)=>t+Number(s.value||0),0);
  const dur = services.filter(s=>ids.includes(s.id)).reduce((t,s)=>t+Number(s.execution_time||0),0);
  function toggle(id){ setIds(ids.includes(id) ? ids.filter(x=>x!==id) : [...ids, id]); }

  async function save(ignore) {
    setError(""); setConflict(null); setSaving(true);
    const body = { owner_name:owner, phone, plate:plate||null, model:model||null, vehicle_type_id:vt||null, date, time, service_ids:ids, photos, ignore_conflict: !!ignore };
    try {
      let res;
      if (appt) res = await api("/appointments/"+appt.id, { method:"PUT", token, body });
      else res = await api("/appointments", { method:"POST", token, body });
      onSaved(res);
    } catch (e) {
      if (e.status === 409 && e.data && e.data.conflict) { setConflict(e.data.with || {}); setSaving(false); }
      else { setError(firstError(e,"Não foi possível salvar.")); setSaving(false); }
    }
  }

  return (
    <Modal title={appt ? "Editar agendamento" : "Novo agendamento"} onClose={onClose} wide>
      {error && <div className="bg-red-50 text-red-700 text-sm rounded-lg px-3 py-2 mb-4">{error}</div>}
      {conflict && (
        <div className="bg-amber-50 border border-amber-200 text-amber-800 text-sm rounded-lg px-3 py-2 mb-4">
          Conflito de horário{conflict.owner_name ? " com " + conflict.owner_name : ""}{conflict.time ? " (" + conflict.time + ")" : ""}.
          <button onClick={()=>save(true)} className="ml-2 underline font-medium">Agendar mesmo assim</button>
        </div>
      )}
      <div className="grid grid-cols-2 gap-3 mb-3">
        <div className="col-span-2"><label className="block text-sm text-slate-600 mb-1.5">Nome do proprietário</label>
          <input value={owner} onChange={(e)=>setOwner(e.target.value)} autoFocus className={inputCls} /></div>
        <div><label className="block text-sm text-slate-600 mb-1.5">Telefone (WhatsApp)</label>
          <input value={phone} onChange={(e)=>setPhone(e.target.value)} className={inputCls} /></div>
        <div><label className="block text-sm text-slate-600 mb-1.5">Placa</label>
          <input value={plate} onChange={(e)=>setPlate(e.target.value.toUpperCase())} placeholder="ABC-1D23" className={inputCls} /></div>
        <div><label className="block text-sm text-slate-600 mb-1.5">Tipo de automóvel</label>
          <select value={vt} onChange={(e)=>{ const nv=e.target.value; setVt(nv); const allow=(nv?services.filter(s=>String(s.vehicle_type_id)===nv||!s.vehicle_type_id):services).map(s=>s.id); setIds(ids.filter(id=>allow.includes(id))); }} className={inputCls + " bg-white"}>
            <option value="">— nenhum —</option>{vtypes.map(v=><option key={v.id} value={v.id}>{v.name}</option>)}</select></div>
        <div><label className="block text-sm text-slate-600 mb-1.5">Modelo</label>
          <input value={model} onChange={(e)=>setModel(e.target.value)} placeholder="Ex.: Onix" className={inputCls} /></div>
        <div><label className="block text-sm text-slate-600 mb-1.5">Data</label>
          <input type="date" value={date} onChange={(e)=>setDate(e.target.value)} className={inputCls} /></div>
        <div><label className="block text-sm text-slate-600 mb-1.5">Hora</label>
          <input type="time" value={time} onChange={(e)=>setTime(e.target.value)} className={inputCls} /></div>
      </div>
      <label className="block text-sm text-slate-600 mb-1.5">Serviços</label>
      <div className="border border-slate-200 rounded-lg divide-y divide-slate-100 mb-3 max-h-44 overflow-y-auto">
        {filtered.length===0 && <div className="px-3 py-4 text-sm text-slate-400 text-center">Cadastre serviços primeiro.</div>}
        {filtered.map(s=>(

function CaixaDia({ token, user }) {
  const [date, setDate] = useState(todayStr());
  const [sum, setSum] = useState(null);
  const [expenses, setExpenses] = useState([]);
  const [error, setError] = useState("");
  const [addExp, setAddExp] = useState(false);
  const [eDesc, setEDesc] = useState(""); const [eVal, setEVal] = useState(""); const [eSaving, setESaving] = useState(false);

  async function load() {
    setError("");
    try {
      const [s, ex] = await Promise.all([ api("/cash/"+date, {token}), api("/expenses?from="+date+"&to="+date, {token}) ]);
      setSum(s); setExpenses(ex);
    } catch (e) { setError(firstError(e,"Erro ao carregar.")); setSum(null); }
  }
  useEffect(()=>{ setSum(null); load(); }, [date]);

  async function togglePaid(cid) {
    try { const r = await api("/cash/"+date+"/toggle-paid", {method:"POST",token,body:{collaborator_id:cid}}); setSum(r.summary); }
    catch (e) { alert(firstError(e,"Erro.")); }
  }
  async function closeDay() {
    if(!window.confirm("Fechar o caixa deste dia? Isso registra os totais.")) return;
    try { const r = await api("/cash/"+date+"/close", {method:"POST",token}); setSum(r.summary); }
    catch(e){ alert(firstError(e,"Erro ao fechar.")); }
  }
  async function saveExpense() {
    if(!eDesc || eVal==="") return;
    setESaving(true);
    try { await api("/expenses",{method:"POST",token,body:{description:eDesc, value:Number(eVal), spent_on:date}}); setEDesc(""); setEVal(""); setAddExp(false); load(); }
    catch(e){ alert(firstError(e,"Erro ao salvar despesa.")); } finally { setESaving(false); }
  }
  async function removeExpense(id){ if(!window.confirm("Excluir despesa?")) return; try{ await api("/expenses/"+id,{method:"DELETE",token}); load(); }catch(e){ alert(firstError(e,"Erro.")); } }

  const card = (label, value, tone) => (

            {card("Líquido", brl(sum.net), sum.net>=0 ? "text-emerald-600" : "text-red-600")}
          </div>

          <div className="bg-white rounded-2xl border border-slate-200">

              ))}
            </div>
          </div>

          <div className="bg-white rounded-2xl border border-slate-200">
            <div className="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
              <span className="text-sm font-semibold text-slate-700">Despesas do dia</span>
              <button onClick={()=>setAddExp(!addExp)} className="text-sm text-blue-600 hover:underline">+ Adicionar</button>
            </div>
            {addExp && (
              <div className="px-4 py-3 border-b border-slate-100 flex flex-wrap items-end gap-2">
                <div className="flex-1 min-w-[140px]"><label className="block text-xs text-slate-500 mb-1">Descrição</label>
                  <input value={eDesc} onChange={(e)=>setEDesc(e.target.value)} className={inputCls} /></div>
                <div className="w-28"><label className="block text-xs text-slate-500 mb-1">Valor</label>
                  <CurrencyInput value={eVal} onChange={setEVal} className={inputCls} /></div>
                <button onClick={saveExpense} disabled={eSaving||!eDesc||eVal===""} className={btnPrimary}>Salvar</button>
              </div>
            )}
            <div className="divide-y divide-slate-100">
              {expenses.length===0 && <div className="px-4 py-6 text-center text-sm text-slate-400">Nenhuma despesa neste dia.</div>}
              {expenses.map(x=>(
                <div key={x.id} className="flex items-center gap-3 px-4 py-3">
                  <div className="flex-1 text-sm text-slate-700">{x.description}</div>
                  <div className="text-sm text-red-600">- {brl(x.value)}</div>
                  <button onClick={()=>removeExpense(x.id)} className="text-xs text-red-600 hover:underline">Excluir</button>
                </div>
              ))}
            </div>
          </div>

          <div className="flex justify-end">
            <button onClick={closeDay} className={btnPrimary}>{sum.closed ? "Refechar caixa do dia" : "Fechar caixa do dia"}</button>
          </div>
        </div>
      )}
    </div>
  );
}

function Comissoes({ token, user }) {
  const [rows, setRows] = useState(null);
  const [error, setError] = useState("");
  const [paying, setPaying] = useState(null);
  async function load(){ setError(""); try{ setRows(await api("/payments/ledger",{token})); }catch(e){ setError(firstError(e,"Erro ao carregar.")); setRows([]); } }
  useEffect(()=>{ load(); }, []);
  if(rows===null) return <div className="text-slate-400 text-sm">Carregando...</div>;
  return (
    <div>
      {error && <div className="bg-red-50 text-red-700 text-sm rounded-lg px-3 py-2 mb-4">{error}</div>}
      <div className="bg-white rounded-2xl border border-slate-200 divide-y divide-slate-100">
        {rows.length===0 && <div className="px-4 py-10 text-center text-sm text-slate-400">Nenhum colaborador.</div>}
        {rows.map(r=>(
          <div key={r.collaborator_id} className="flex items-center gap-3 px-4 py-3">
            <div className="flex-1 min-w-0">
              <div className="text-sm font-medium text-slate-800">{r.name}</div>
              <div className="text-xs text-slate-400">Ganho {brl(r.earned)} {String.fromCharCode(183)} Pago {brl(r.paid)}</div>
            </div>
            <div className="text-right">
              <div className={"text-sm font-semibold " + (r.balance>0 ? "text-amber-600" : "text-emerald-600")}>{brl(r.balance)}</div>
              <div className="text-[10px] text-slate-400">a receber</div>
            </div>
            {r.balance>0 && <button onClick={()=>setPaying(r)} className="text-sm text-blue-600 hover:underline">Pagar</button>}
          </div>
        ))}
      </div>
      {paying && <PagamentoModal token={token} row={paying} onClose={()=>setPaying(null)} onDone={()=>{ setPaying(null); load(); }} />}
    </div>
  );
}

function PagamentoModal({ token, row, onClose, onDone }) {
  const [amount, setAmount] = useState(row.balance>0 ? Number(row.balance) : "");
  const [date, setDate] = useState(todayStr());
  const [saving, setSaving] = useState(false); const [error, setError] = useState("");
  async function pay(){
    if(amount==="" || Number(amount)<=0){ setError("Informe um valor."); return; }
    setSaving(true); setError("");
    try{ await api("/payments",{method:"POST",token,body:{collaborator_id:row.collaborator_id, amount:Number(amount), paid_on:date}}); onDone(); }
    catch(e){ setError(firstError(e,"Erro ao registrar.")); setSaving(false); }
  }
  return (
    <Modal title={"Pagar " + row.name} onClose={onClose}>
      {error && <div className="bg-red-50 text-red-700 text-sm rounded-lg px-3 py-2 mb-4">{error}</div>}
      <p className="text-sm text-slate-500 mb-1">A receber: <span className="font-medium text-slate-700">{brl(row.balance)}</span></p>
      {row.pix && <p className="text-xs text-slate-400 mb-4">PIX: {row.pix}</p>}
      <label className="block text-sm text-slate-600 mb-1.5">Valor</label>
      <div className="mb-4"><CurrencyInput value={amount} onChange={setAmount} className={inputCls} /></div>
      <label className="block text-sm text-slate-600 mb-1.5">Data do pagamento</label>
      <input type="date" value={date} onChange={(e)=>setDate(e.target.value)} className={inputCls+" mb-6"} />
      <div className="flex justify-end gap-2">
        <button onClick={onClose} className={btnGhost}>Cancelar</button>
        <button onClick={pay} disabled={saving} className={btnPrimary}>{saving ? "Salvando..." : "Confirmar pagamento"}</button>
      </div>
    </Modal>
  );
}

function Financeiro({ token, user }) {
  const [tab, setTab] = useState("caixa");
  const tabs = [ {id:"caixa",label:"Caixa do dia"}, {id:"comissoes",label:"Comissões"}, {id:"relatorios",label:"Relatórios"} ];
  return (
    <div>
      <div className="flex gap-1 mb-4 border-b border-slate-200 overflow-x-auto">
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} className={"px-3 py-2 text-sm whitespace-nowrap border-b-2 " + (tab===t.id ? "border-blue-600 text-blue-700 font-medium" : "border-transparent text-slate-500 hover:text-slate-800")}>{t.label}</button>
        ))}
      </div>
      {tab==="caixa" && <CaixaDia token={token} user={user} />}
      {tab==="comissoes" && <Comissoes token={token} user={user} />}
      {tab==="relatorios" && <div className="text-slate-400 text-sm">Relatórios em breve.</div>}
    </div>
  );
}

function App() {
  const [token, setToken] = useState(() => localStorage.getItem(tokenKey));
  const [user, setUser] = useState(null);
  const [booting, setBooting] = useState(!!localStorage.getItem(tokenKey));
  const [page, setPage] = useState("agendamentos");
  useEffect(() => {
    if (token) api("/me", { token }).then((u)=>{ setUser(u); setBooting(false); })
      .catch(()=>{ localStorage.removeItem(tokenKey); setToken(null); setBooting(false); });
  }, []);
  if (!slug) return <NoSlug />;
  if (booting) return <Splash />;
  if (!token || !user) return <Login slug={slug} onLogged={(t,u)=>{ setToken(t); setUser(u); }} />;
  return (
    <Layout user={user} slug={slug} page={page} setPage={setPage}
      onLogout={()=>{ api("/logout",{method:"POST",token}).catch(()=>{}); localStorage.removeItem(tokenKey); setToken(null); setUser(null); }}>
      {page==="agendamentos" && <Agendamentos token={token} user={user} />}
      {page==="colaboradores" && <Colaboradores token={token} user={user} />}
      {page==="financeiro" && <Financeiro token={token} user={user} />}
      {page==="servicos" && <Servicos token={token} user={user} />}
      {page==="tipos" && <Tipos token={token} user={user} />}
    </Layout>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
