<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#2563eb" />
<title>AgendAqui</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { margin:0; padding:0; background:#f1f5f9; -webkit-text-size-adjust:100%; text-size-adjust:100%; -webkit-tap-highlight-color: transparent; overflow-x: hidden; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #root { min-height:100vh; }
</style>
</head>
<body class="bg-slate-100">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

const API = "/api";
function getSlug() { return window.location.pathname.split("/").filter(Boolean)[0] || null; }
const slug = getSlug();
const tokenKey = "agendaqui_token_" + (slug || "_root");
const brl = (n) => Number(n || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
function todayStr() { const d = new Date(); const p=(n)=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function fmtDate(x){ const p=(n)=>String(n).padStart(2,"0"); return x.getFullYear()+"-"+p(x.getMonth()+1)+"-"+p(x.getDate()); }
const WEEKDAYS = ["Domingo","Segunda-féria","Terça-féria","Quarta-féria","Quinta-féria","Sexta-féria","ábado"];
function weekdayName(dateStr){ if(!dateStr) return ""; const d = new Date(dateStr+"T12:00:00"); return WEEKDAYS[d.getDay()]; }
const hasContactPicker = (typeof navigator !== "undefined") && ("contacts" in navigator) && (typeof window !== "undefined") && ("ContactsManager" in window);
function fileToDataURL(file, max) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        const m = max || 1000;
        if (width > m || height > m) { const r = Math.min(m/width, m/height); width = Math.round(width*r); height = Math.round(height*r); }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", 0.7));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function endTime(t, mins){ if(!t) return ''; const q=t.split(':'); const tot=(+q[0])*60+(+q[1])+(mins||0); const p=(n)=>String(n).padStart(2,'0'); return p(Math.floor(tot/60)%24)+':'+p(tot%60); }
function waLink(phone, text) { let d=(phone||"").replace(/\D/g,""); if(d.length<=11) d="55"+d; return "https://wa.me/"+d+"?text="+encodeURIComponent(text||""); }
const STATUS = {
  aguardando: { label:"Aguardando", cls:"bg-amber-50 text-amber-700 border-amber-200" },
  andamento:  { label:"Em andamento", cls:"bg-blue-50 text-blue-700 border-blue-200" },
  concluido:  { label:"Concluído", cls:"bg-emerald-50 text-emerald-700 border-emerald-200" },
  cancelado:  { label:"Cancelado", cls:"bg-slate-100 text-slate-500 border-slate-200" },
};

async function api(path, opts = {}) {
  const { method = "GET", body, token } = opts;
  const headers = { Accept: "application/json" };
  if (body) headers["Content-Type"] = "application/json";
  if (token) headers["Authorization"] = "Bearer " + token;
  const res = await fetch(API + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  let data = null; try { data = await res.json(); } catch (e) {}
  if (!res.ok) { const err = new Error((data && data.message) || ("Erro " + res.status)); err.status = res.status; err.data = data; throw err; }
  return data;
}
function firstError(e, fallback) {
  if (e && e.data && e.data.errors) { const k = Object.keys(e.data.errors)[0]; if (k) return e.data.errors[k][0]; }
  return (e && e.message) || fallback;
}

// ---------- UI base ----------
function Modal({ title, onClose, children, wide }) {
  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50" onClick={(e)=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className={"bg-white rounded-2xl w-full " + (wide?"max-w-lg":"max-w-md") + " p-6 shadow-xl max-h-[90vh] overflow-y-auto"}>
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-lg font-semibold text-slate-800">{title}</h3>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">×</button>
        </div>
        {children}
      </div>
    </div>
  );
}
const inputCls = "w-full px-3 py-2.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500";
const btnPrimary = "bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white text-sm font-medium px-4 py-2.5 rounded-lg transition-colors";
const btnGhost = "text-sm border border-slate-200 hover:bg-slate-50 text-slate-700 px-4 py-2.5 rounded-lg";
function CurrencyInput({ value, onChange, className }) {
  const display = (value === "" || value == null) ? "" : Number(value).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return <input value={display} inputMode="numeric" placeholder="0,00" onChange={(e)=>{ const d=e.target.value.replace(/[^0-9]/g,""); onChange(d ? parseInt(d,10)/100 : ""); }} className={className} />;
}

// ---------- Entrada ----------
function NoSlug() {
  const [s, setS] = useState("");
  return (
    <div className="min-h-screen flex items-center justify-center p-4">
      <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 w-full max-w-md text-center">
        <div className="w-12 h-12 rounded-xl bg-blue-600 text-white flex items-center justify-center mx-auto mb-4 text-xl font-bold">A</div>
        <h1 className="text-lg font-semibold text-slate-800">AgendAqui</h1>
        <p className="text-sm text-slate-500 mt-1 mb-5">Informe o endereço do seu ambiente.</p>
        <div className="flex items-stretch border border-slate-300 rounded-lg overflow-hidden mb-3">
          <span className="flex items-center px-3 text-sm text-slate-400 bg-slate-50 border-r border-slate-200">/</span>
          <input value={s} onChange={(e)=>setS(e.target.value.toLowerCase().replace(/[^a-z0-9-]/g,""))} placeholder="seu-ambiente" className="flex-1 px-3 py-2.5 text-sm focus:outline-none" />
        </div>
        <button onClick={()=>{ if(s) window.location.pathname="/"+s; }} className={btnPrimary + " w-full"}>Acessar</button>
      </div>
    </div>
  );
}
function Splash() { return <div className="min-h-screen flex items-center justify-center"><div className="text-slate-400 text-sm">Carregando…</div></div>; }

function Login({ slug, onLogged }) {
  const [username, setU] = useState(""); const [password, setP] = useState("");
  const [loading, setL] = useState(false); const [error, setE] = useState("");
  async function submit() {
    if (!username || !password) { setE("Preencha usuário e senha."); return; }
    setE(""); setL(true);
    try { const r = await api("/login", { method:"POST", body:{ username, password, tenant: slug } });
      localStorage.setItem(tokenKey, r.token); onLogged(r.token, r.user);
    } catch (e) { setE(e.status===422||e.status===401 ? "Usuário ou senha inválidos." : firstError(e,"Não foi possível entrar.")); }
    finally { setL(false); }
  }
  return (
    <div className="min-h-screen flex items-center justify-center p-4">
      <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 w-full max-w-sm">
        <div className="text-center mb-6">
          <div className="w-12 h-12 rounded-xl bg-blue-600 text-white flex items-center justify-center mx-auto mb-3 text-xl font-bold">A</div>
          <h1 className="text-lg font-semibold text-slate-800">AgendAqui</h1>
          <p className="text-sm text-slate-500 mt-1">Ambiente <span className="font-medium text-slate-700">{slug}</span></p>
        </div>
        {error && <div className="bg-red-50 text-red-700 text-sm rounded-lg px-3 py-2 mb-4">{error}</div>}
        <label className="block text-sm text-slate-600 mb-1.5">Usuário</label>
        <input value={username} onChange={(e)=>setU(e.target.value)} autoFocus className={inputCls + " mb-4"} />
        <label className="block text-sm text-slate-600 mb-1.5">Senha</label>
        <input type="password" value={password} onChange={(e)=>setP(e.target.value)} onKeyDown={(e)=>{ if(e.key==="Enter") submit(); }} className={inputCls + " mb-5"} />
        <button onClick={submit} disabled={loading} className={btnPrimary + " w-full"}>{loading ? "Entrando…" : "Entrar"}</button>
      </div>
    </div>
  );
}

// ---------- Layout ----------
function NavIcon({ name }) {
  const paths = {
    inicio: "M3 11l9-8 9 8M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10",
    agendamentos: "M8 2v3M16 2v3M4 6h16a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1zM3 10h18",
    servicos: "M12 3s6 6.5 6 10.5a6 6 0 0 1-12 0C6 9.5 12 3 12 3z",
    tipos: "M5 11l1.5-4A2 2 0 0 1 8.4 6h7.2a2 2 0 0 1 1.9 1.4L19 11M4 11h16v5H4zM7 16v2M17 16v2",
    colaboradores: "M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.9",
    financeiro: "M3 7h15a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a1 1 0 0 1 1-1h13M17 13h.01",
    mais: "M5 12h.01M12 12h.01M19 12h.01",
  };
  return (<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d={paths[name] || ""} /></svg>);
}

function Layout({ user, slug, page, setPage, onNew, onLogout, children }) {
  const isAdmin = user.role === "admin";
  const left = [ { id:"inicio", label:"Início", icon:"inicio" }, { id:"agendamentos", label:"Agenda", icon:"agendamentos" } ];
  const right = isAdmin ? [ { id:"financeiro", label:"Caixa", icon:"financeiro" }, { id:"mais", label:"Mais", icon:"mais" } ] : [];
  const Item = (n) => (
    <button key={n.id} onClick={()=>setPage(n.id)} className={"flex-1 flex flex-col items-center gap-0.5 py-2 text-[11px] font-medium " + (page===n.id ? "text-blue-600" : "text-slate-400")}>
      <NavIcon name={n.icon} /><span>{n.label}</span>
    </button>
  );
  return (
    <div className="min-h-screen pb-24">
      <header className="bg-blue-600 text-white sticky top-0 z-40 shadow-sm">
        <div className="max-w-md mx-auto px-4 h-14 flex items-center justify-between">
          <div className="flex items-center gap-2">
            <div className="w-8 h-8 rounded-lg bg-white/20 flex items-center justify-center font-bold">A</div>
            <span className="font-semibold">AgendAqui</span>
            <span className="text-xs text-white/70 border border-white/30 rounded px-1.5 py-0.5">{slug}</span>
          </div>
          <button onClick={onLogout} className="text-sm text-white/80 hover:text-white">Sair</button>
        </div>
      </header>
      <main className="max-w-md mx-auto px-4 py-5">{children}</main>
      <nav className="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 z-40">
        <div className="max-w-md mx-auto flex items-center">
          {left.map(Item)}
          <div className="flex-1 flex justify-center">
            <button onClick={onNew} aria-label="Novo agendamento" className="w-14 h-14 -mt-7 rounded-full bg-blue-600 hover:bg-blue-700 text-white shadow-lg ring-4 ring-slate-100 flex items-center justify-center text-3xl leading-none">+</button>
          </div>
          {right.map(Item)}
        </div>
      </nav>
    </div>
  );
}

function Mais({ user, setPage }) {
  const isAdmin = user.role === "admin";
  const opts = isAdmin ? [
    { id:"servicos", label:"Serviços", desc:"Catálogo e preços" },
    { id:"tipos", label:"Tipos de automóvel", desc:"Categorias de veículos" },
    { id:"colaboradores", label:"Colaboradores", desc:"Equipe e comissões" },
    { id:"usuarios", label:"Usuários", desc:"Administradores e colaboradores" },
    { id:"config", label:"Mensagens automáticas", desc:"Textos enviados no WhatsApp" },
  ] : [];
  return (
    <div>
      <h2 className="text-lg font-semibold text-slate-800 mb-3">Mais</h2>
      <div className="space-y-2">
        {opts.map(o=>(
          <button key={o.id} onClick={()=>setPage(o.id)} className="w-full bg-white rounded-2xl border border-slate-200 px-4 py-3.5 flex items-center justify-between hover:border-blue-300">
            <div className="text-left"><div className="text-sm font-medium text-slate-800">{o.label}</div><div className="text-xs text-slate-400">{o.desc}</div></div>
            <span className="text-slate-300 text-lg">{String.fromCharCode(8250)}</span>
          </button>
        ))}
      </div>
    </div>
  );
}
function WhatsApp({ wa, onClose }) {
  return (
    <Modal title="Mensagem para o cliente" onClose={onClose}>
      <textarea readOnly value={wa.text} rows={6} className={inputCls + " mb-4 resize-none"} />
      <div className="flex justify-end gap-2">
        <button onClick={()=>{ navigator.clipboard && navigator.clipboard.writeText(wa.text); }} className={btnGhost}>Copiar</button>
        <a href={waLink(wa.phone, wa.text)} target="_blank" rel="noreferrer" className={btnPrimary + " inline-block"}>Abrir no WhatsApp</a>
      </div>
    </Modal>
  );
}

// ---------- Agendamentos ----------
function PhotosModal({ token, appt, onClose }) {
  const [photos, setPhotos] = useState(null);
  useEffect(()=>{ api("/appointments/"+appt.id, { token }).then(r=>setPhotos(r.photos||[])).catch(()=>setPhotos([])); }, []);
  return (
    <Modal title="Fotos do veículo" onClose={onClose} wide>
      {photos===null ? <div className="text-slate-400 text-sm">Carregando...</div> : (
        photos.length===0 ? <div className="text-slate-400 text-sm">Nenhuma foto.</div> : (
          <div className="grid grid-cols-3 gap-2">
            {photos.map(p=><img key={p.id} src={p.data} className="w-full h-28 object-cover rounded-lg border border-slate-200" />)}
          </div>
        )
      )}
    </Modal>
  );
}
function Agendamentos({ token, user, newSignal, lastConsumed, onConsumedNew, home }) {
  const [period, setPeriod] = useState("dia");
  function range(){ if(period==="dia") return { from: date, to: date }; const d = new Date(date + "T12:00:00"); if(period==="semana"){ const s=new Date(d); s.setDate(d.getDate()-d.getDay()); const e=new Date(s); e.setDate(s.getDate()+6); return { from: fmtDate(s), to: fmtDate(e) }; } const s=new Date(d.getFullYear(), d.getMonth(), 1); const e=new Date(d.getFullYear(), d.getMonth()+1, 0); return { from: fmtDate(s), to: fmtDate(e) }; }
  const isAdmin = user.role === "admin";
  const [date, setDate] = useState(todayStr());
  const [list, setList] = useState(null);
  const [services, setServices] = useState([]);
  const [collabs, setCollabs] = useState([]);
  const [vtypes, setVtypes] = useState([]);
  const [error, setError] = useState("");
  const [editing, setEditing] = useState(null);     // null | 'new' | appt
  const [completing, setCompleting] = useState(null); // null | appt
  const [wa, setWa] = useState(null);
  const [viewingPhotos, setViewingPhotos] = useState(null);

  async function loadBase() {
    try {
      const [s, c, v] = await Promise.all([api("/services",{token}), api("/collaborators",{token}), api("/vehicle-types",{token})]);
      setServices(s); setCollabs(c); setVtypes(v);
    } catch (e) {}
  }
  async function load() {
    setError("");
    try {
      const rg = range();
      const r = await api("/appointments?from=" + rg.from + "&to=" + rg.to, { token });
      r.sort((a,b)=> (a.scheduled_at||"").localeCompare(b.scheduled_at||""));
      setList(r);
    } catch (e) { setError(firstError(e,"Erro ao carregar.")); setList([]); }
  }
  useEffect(()=>{ loadBase(); }, []);
  useEffect(()=>{ if(newSignal && newSignal !== lastConsumed){ setEditing("new"); onConsumedNew && onConsumedNew(newSignal); } }, [newSignal]);
  useEffect(()=>{ setList(null); load(); }, [date, period]);

  async function start(a){ try{ await api("/appointments/"+a.id+"/start",{method:"POST",token}); load(); }catch(e){ alert(firstError(e,"Erro.")); } }
  async function cancel(a){ if(!window.confirm("Cancelar o agendamento de "+a.owner_name+"?")) return; try{ await api("/appointments/"+a.id+"/cancel",{method:"POST",token}); load(); }catch(e){ alert(firstError(e,"Erro.")); } }
  async function reopen(a){ try{ await api("/appointments/"+a.id+"/reopen",{method:"POST",token}); load(); }catch(e){ alert(firstError(e,"Erro.")); } }
  async function remove(a){ if(!window.confirm("Excluir definitivamente este agendamento?")) return; try{ await api("/appointments/"+a.id,{method:"DELETE",token}); load(); }catch(e){ alert(firstError(e,"Erro.")); } }

  return (
    <div>
            <div className="mb-4">
        <h2 className="text-lg font-semibold text-slate-800 mb-3">{home ? "Agenda de hoje" : "Agenda"}</h2>
        <div className={"flex items-center gap-2 flex-wrap " + (home ? "hidden" : "")}>
          <div className="flex bg-slate-100 rounded-lg p-0.5">
            {[["dia","Dia"],["semana","Semana"],["mes","M"+String.fromCharCode(234)+"s"]].map(pp=>(
              <button key={pp[0]} onClick={()=>setPeriod(pp[0])} className={"px-3 py-1.5 text-sm rounded-md " + (period===pp[0] ? "bg-white shadow-sm text-blue-600 font-medium" : "text-slate-500")}>{pp[1]}</button>
            ))}
          </div>
          <input type="date" value={date} onChange={(e)=>setDate(e.target.value)} className={inputCls + " w-auto"} />
        </div>
      </div>
      {error && <div className="bg-red-50 text-red-700 text-sm rounded-lg px-3 py-2 mb-4">{error}</div>}
      {list === null ? <div className="text-slate-400 text-sm">Carregando…</div> : (
        <div className="space-y-3">
          {list.length === 0 && <div className="bg-white rounded-2xl border border-slate-200 px-4 py-10 text-center text-sm text-slate-400">Nenhum agendamento neste dia.</div>}
          {list.map((a)=>(
            <ApptCard key={a.id} a={a} isAdmin={isAdmin} showDate={period!=="dia"}
              onStart={()=>start(a)} onComplete={()=>setCompleting(a)} onCancel={()=>cancel(a)}
              onEdit={()=>setEditing(a)} onRemove={()=>remove(a)} onPhotos={()=>setViewingPhotos(a)} onReopen={()=>reopen(a)} />
          ))}
        </div>
      )}

      {editing && <ApptForm token={token} services={services} vtypes={vtypes} appt={editing==="new"?null:editing} defaultDate={date}
        onClose={()=>setEditing(null)} onSaved={(res)=>{ setEditing(null); if(res && res.whatsapp) setWa(res.whatsapp); load(); }} />}
      {completing && <CompleteModal token={token} appt={completing} collabs={collabs}
        onClose={()=>setCompleting(null)} onDone={(res)=>{ setCompleting(null); if(res && res.whatsapp) setWa(res.whatsapp); load(); }} />}
      {wa && <WhatsApp wa={wa} onClose={()=>setWa(null)} />}
      {viewingPhotos && <PhotosModal token={token} appt={viewingPhotos} onClose={()=>setViewingPhotos(null)} />}
    </div>
  );
}

function ApptCard({ a, isAdmin, onStart, onComplete, onCancel, onEdit, onRemove, onPhotos, onReopen, showDate }) {
  const st = STATUS[a.status] || STATUS.aguardando;
  const dim = a.status === "cancelado";
  return (
    <div className={"bg-white rounded-2xl border border-slate-200 p-4 " + (dim?"opacity-60":"")}>
      {showDate && a.date && <div className="text-xs font-semibold text-blue-600 mb-2">{weekdayName(a.date)}, {a.date.split("-").reverse().join("/").slice(0,5)}</div>}
      <div className="flex items-start gap-3">
        <div className="text-center w-14 shrink-0">
          <div className="text-lg font-semibold text-slate-800">{a.time}</div>
          <div className="text-xs text-slate-400">{a.duration}min</div>
        </div>
        <div className="flex-1 min-w-0">
          <div className="flex items-center gap-2 flex-wrap">
            <span className="text-sm font-medium text-slate-800">{a.owner_name}</span>
            <span className={"text-xs px-2 py-0.5 rounded-full border " + st.cls}>{st.label}</span>
            {a.is_late && <span className="text-xs px-2 py-0.5 rounded-full bg-red-50 text-red-600 border border-red-200">atrasado</span>}
          </div>
          <div className="text-xs text-slate-400 mt-0.5">
            {a.phone}{a.plate ? " · " + a.plate : ""}{a.model ? " · " + a.model : ""}
          </div>
          <div className="text-sm text-slate-600 mt-1">{(a.services||[]).map(s=>s.name).join(", ")}</div>
          <div className="text-sm font-medium text-slate-800 mt-1">{brl(a.value)}{a.photos && a.photos.length>0 && <button onClick={onPhotos} className="ml-2 text-xs font-normal text-blue-600 hover:underline">Fotos ({a.photos.length})</button>}
            {a.status==="concluido" && a.collaborator ? <span className="text-xs font-normal text-slate-400"> · {a.collaborator.name}</span> : null}
          </div>
        </div>
      </div>
            <div className="flex flex-wrap gap-2 mt-3 pt-3 border-t border-slate-100">
        {a.status === "aguardando" && <button onClick={onStart} className="text-sm bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg">Iniciar</button>}
        {a.status === "andamento" && <button onClick={onComplete} className="text-sm bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg">Concluir</button>}
        {(a.status === "concluido" || a.status === "cancelado") && <button onClick={onReopen} className="text-sm bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded-lg">Reabrir</button>}
        <button onClick={onEdit} className="text-sm border border-slate-200 hover:bg-slate-50 text-slate-700 px-3 py-1.5 rounded-lg">Editar</button>
        {a.status !== "concluido" && a.status !== "cancelado" && <button onClick={onCancel} className="text-sm border border-slate-200 hover:bg-slate-50 text-slate-600 px-3 py-1.5 rounded-lg">Cancelar</button>}
        {isAdmin && <button onClick={onRemove} className="text-sm text-red-600 hover:underline px-2 py-1.5">Excluir</button>}
      </div>
    </div>
  );
}

function ApptForm({ token, services, vtypes, appt, defaultDate, onClose, onSaved }) {
  const [owner, setOwner] = useState(appt ? appt.owner_name : "");
  const [phone, setPhone] = useState(appt ? appt.phone : "");
  const [plate, setPlate] = useState(appt && appt.plate ? appt.plate : "");
  const [model, setModel] = useState(appt && appt.model ? appt.model : "");
  const [vt, setVt] = useState(appt && appt.vehicle_type_id ? String(appt.vehicle_type_id) : "");
  const [date, setDate] = useState(appt ? appt.date : defaultDate);
  const [time, setTime] = useState(appt ? appt.time : "08:00");
  const [ids, setIds] = useState(appt ? (appt.services||[]).map(s=>s.id) : []);
  const [saving, setSaving] = useState(false); const [error, setError] = useState("");
  const [conflict, setConflict] = useState(null);
  const [photos, setPhotos] = useState([]);
  const [sugg, setSugg] = useState([]); const [showSugg, setShowSugg] = useState(false);
  const suggTimer = React.useRef(null);
  function onOwner(v){ setOwner(v); if(suggTimer.current) clearTimeout(suggTimer.current); if(v.trim().length<2){ setSugg([]); setShowSugg(false); return; } suggTimer.current = setTimeout(async()=>{ try{ const r = await api("/clients?q="+encodeURIComponent(v.trim()), {token}); setSugg(r||[]); setShowSugg(true); }catch(e){} }, 300); }
  function pickClient(c){ setOwner(c.owner_name); setPhone(c.phone||""); setPlate(c.plate||""); setModel(c.model||""); setVt(c.vehicle_type_id?String(c.vehicle_type_id):""); setSugg([]); setShowSugg(false); }
  async function pickContact(){
    try {
      const contacts = await navigator.contacts.select(["tel","name"], { multiple: false });
      if (contacts && contacts[0]) {
        const c = contacts[0];
        if (c.tel && c.tel[0]) setPhone(c.tel[0].replace(/[^0-9+]/g,""));
        if (!owner && c.name && c.name[0]) setOwner(c.name[0]);
      }
    } catch (e) { /* usuario cancelou */ }
  }
  async function addPhotos(files){ const arr=[]; for(const fl of Array.from(files)){ arr.push(await fileToDataURL(fl, 1000)); } setPhotos(p=>[...p, ...arr]); }

  const filtered = vt ? services.filter(s=> !s.vehicle_types || s.vehicle_types.length===0 || s.vehicle_types.some(x=>String(x.id)===vt)) : services;
  const total = services.filter(s=>ids.includes(s.id)).reduce((t,s)=>t+Number(s.value||0),0);
  const dur = services.filter(s=>ids.includes(s.id)).reduce((t,s)=>t+Number(s.execution_time||0),0);
  function toggle(id){ setIds(ids.includes(id) ? ids.filter(x=>x!==id) : [...ids, id]); }

  async function save(ignore) {
    setError(""); setConflict(null); setSaving(true);
    const body = { owner_name:owner, phone, plate:plate||null, model:model||null, vehicle_type_id:vt||null, date, time, service_ids:ids, photos, ignore_conflict: !!ignore };
    try {
      let res;
      if (appt) res = await api("/appointments/"+appt.id, { method:"PUT", token, body });
      else res = await api("/appointments", { method:"POST", token, body });
      onSaved(res);
    } catch (e) {
      if (e.status === 409 && e.data && e.data.conflict) { setConflict(e.data.with || {}); setSaving(false); }
      else { setError(firstError(e,"Não foi possível salvar.")); setSaving(false); }
    }
  }

  return (
    <Modal title={appt ? "Editar agendamento" : "Novo agendamento"} onClose={onClose} wide>
      {error && <div className="bg-red-50 text-red-700 text-sm rounded-lg px-3 py-2 mb-4">{error}</div>}
      {conflict && (
        <div className="bg-amber-50 border border-amber-200 text-amber-800 text-sm rounded-lg px-3 py-2 mb-4">
          Conflito de horário{conflict.owner_name ? " com " + conflict.owner_name : ""}{conflict.time ? " (" + conflict.time + ")" : ""}.
          <button onClick={()=>save(true)} className="ml-2 underline font-medium">Agendar mesmo assim</button>
        </div>
      )}
      <div className="grid grid-cols-2 gap-3 mb-3">
        <div className="col-span-2"><label className="block text-sm text-slate-600 mb-1.5">Nome do proprietário</label>
          <div className="relative"><input value={owner} onChange={(e)=>onOwner(e.target.value)} onFocus={()=>{ if(sugg.length) setShowSugg(true); }} autoFocus autoComplete="off" className={inputCls} />{showSugg && sugg.length>0 && (<div className="absolute z-20 left-0 right-0 mt-1 bg-white border border-slate-200 rounded-lg shadow-lg max-h-52 overflow-y-auto">{sugg.map((c,ix)=>(<button type="button" key={ix} onClick={()=>pickClient(c)} className="w-full text-left px-3 py-2 hover:bg-slate-50 border-b border-slate-100 last:border-0"><div className="text-sm text-slate-800">{c.owner_name}</div><div className="text-xs text-slate-400">{[c.phone, c.plate, c.vehicle_type].filter(Boolean).join(" " + String.fromCharCode(183) + " ")}</div></button>))}</div>)}</div></div>
                <div><label className="block text-sm text-slate-600 mb-1.5">Telefone (WhatsApp)</label>
          <div className="flex gap-2">
            <input value={phone} onChange={(e)=>setPhone(e.target.value)} className={inputCls} />
            {hasContactPicker && <button type="button" onClick={pickContact} title="Buscar na agenda" className="shrink-0 w-11 rounded-lg border border-slate-300 text-slate-500 hover:bg-slate-50 flex items-center justify-center">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
            </button>}
          </div></div>
        <div><label className="block text-sm text-slate-600 mb-1.5">Placa</label>
          <input value={plate} onChange={(e)=>setPlate(e.target.value.toUpperCase())} placeholder="ABC-1D23" className={inputCls} /></div>
        <div><label className="block text-sm text-slate-600 mb-1.5">Tipo de automóvel</label>
          <select value={vt} onChange={(e)=>{ const nv=e.target.value; setVt(nv); const allow=(nv?services.filter(s=>!s.vehicle_types||s.vehicle_types.length===0||s.vehicle_types.some(x=>String(x.id)===nv)):services).map(s=>s.id); setIds(ids.filter(id=>allow.includes(id))); }} className={inputCls + " bg-white"}>

          <input type="time" value={time} onChange={(e)=>setTime(e.target.value)} className={inputCls} /></div>
      </div>
      <label className="block text-sm text-slate-600 mb-1.5">Serviços</label>
      <div className="border border-slate-200 rounded-lg divide-y divide-slate-100 mb-3 max-h-44 overflow-y-auto">

            <input type="checkbox" checked={ids.includes(s.id)} onChange={()=>toggle(s.id)} />

            <span className="text-xs text-slate-400">{s.execution_time}min</span>
            <span className="text-sm text-slate-600 w-20 text-right">{brl(s.value)}</span>
          </label>
        ))}
      </div>
      <label className="block text-sm text-slate-600 mb-1.5">Fotos do veículo (opcional)</label>
      <div className="flex flex-wrap gap-2 mb-3">
        {photos.map((p,idx)=>(
          <div key={idx} className="relative">
            <img src={p} className="w-16 h-16 object-cover rounded-lg border border-slate-200" />
            <button type="button" onClick={()=>setPhotos(photos.filter((_,x)=>x!==idx))} className="absolute -top-1.5 -right-1.5 bg-red-500 text-white rounded-full w-5 h-5 text-xs leading-none">x</button>
          </div>

        <label className="w-16 h-16 rounded-lg border-2 border-dashed border-slate-300 flex items-center justify-center text-[11px] font-medium text-slate-500 text-center cursor-pointer hover:border-blue-400 hover:text-blue-500">Câmera<input type="file" accept="image/*" capture="environment" className="hidden" onChange={(ev)=>addPhotos(ev.target.files)} /></label>

      </div>
      <div className="flex items-center justify-between text-sm mb-5">
        <span className="text-slate-500">{ids.length} serviço(s) · {dur} min · término previsto {endTime(time, dur)}</span>

                <div className="text-sm font-medium text-slate-800">{c.name}</div>
                <div className="text-xs text-slate-400">{c.phone || "sem telefone"}{ganho>0 ? " " + String.fromCharCode(183) + " ganho config.: "+brl(ganho) : ""}</div>

function ColaboradorForm({ token, services, collab, onClose, onSaved }) {
  const [name, setName] = useState(collab ? collab.name : "");
  const [cpf, setCpf] = useState(collab && collab.cpf ? collab.cpf : "");
  const [phone, setPhone] = useState(collab && collab.phone ? collab.phone : "");
  const [pix, setPix] = useState(collab && collab.pix ? collab.pix : "");
  const initComm = {};
  if (collab) (collab.services||[]).forEach(s=>{ initComm[s.id] = (s.pivot && s.pivot.commission)!=null ? Number(s.pivot.commission) : ""; });
  const [comm, setComm] = useState(initComm);
  const [saving, setSaving] = useState(false); const [error, setError] = useState("");
  function setC(id, v){ setComm({...comm, [id]: v}); }
  async function save() {
    setError(""); setSaving(true);
    const commissions = {}; Object.keys(comm).forEach(k=>{ if(comm[k]!=="" && comm[k]!=null) commissions[k]=comm[k]; });
    const body = { name, cpf:cpf||null, phone:phone||null, pix:pix||null, commissions };
    try { if(collab) await api("/collaborators/"+collab.id,{method:"PUT",token,body}); else await api("/collaborators",{method:"POST",token,body}); onSaved(); }
    catch(e){ setError(firstError(e,"não foi possível salvar.")); setSaving(false); }
  }
  return (
    <Modal title={collab ? "Editar colaborador" : "Novo colaborador"} onClose={onClose} wide>
      {error && <div className="bg-red-50 text-red-700 text-sm rounded-lg px-3 py-2 mb-4">{error}</div>}
      <div className="grid grid-cols-2 gap-3 mb-4">
        <div className="col-span-2"><label className="block text-sm text-slate-600 mb-1.5">Nome</label>
          <input value={name} onChange={(e)=>setName(e.target.value)} autoFocus className={inputCls} /></div>
        <div><label className="block text-sm text-slate-600 mb-1.5">CPF</label>
          <input value={cpf} onChange={(e)=>setCpf(e.target.value)} className={inputCls} /></div>
        <div><label className="block text-sm text-slate-600 mb-1.5">Telefone</label>
          <input value={phone} onChange={(e)=>setPhone(e.target.value)} className={inputCls} /></div>
        <div className="col-span-2"><label className="block text-sm text-slate-600 mb-1.5">Chave PIX</label>
          <input value={pix} onChange={(e)=>setPix(e.target.value)} className={inputCls} /></div>
      </div>
      <label className="block text-sm font-medium text-slate-700 mb-1">Comissões por serviço</label>
      <p className="text-xs text-slate-400 mb-2">Quanto o colaborador ganha em cada serviço (deixe vazio se não executa).</p>
      <div className="border border-slate-200 rounded-lg divide-y divide-slate-100 mb-6 max-h-52 overflow-y-auto">
        {services.length===0 && <div className="px-3 py-4 text-sm text-slate-400 text-center">Cadastre serviços primeiro.</div>}
        {services.map(s=>(
          <div key={s.id} className="flex items-center gap-3 px-3 py-2">
            <span className="flex-1 text-sm text-slate-700">{s.name}</span>
            <div className="w-28"><CurrencyInput value={comm[s.id]!=null?comm[s.id]:""} onChange={(v)=>setC(s.id, v)} className={inputCls} /></div>
          </div>
        ))}
      </div>
      <div className="flex justify-end gap-2">
        <button onClick={onClose} className={btnGhost}>Cancelar</button>
        <button onClick={save} disabled={saving || !name} className={btnPrimary}>{saving ? "Salvando..." : "Salvar"}</button>
      </div>
    </Modal>
  );
}

function CaixaDia({ token, user }) {
  const [date, setDate] = useState(todayStr());
  const [sum, setSum] = useState(null);
  const [expenses, setExpenses] = useState([]);
  const [error, setError] = useState("");
  const [addExp, setAddExp] = useState(false);
  const [eDesc, setEDesc] = useState(""); const [eVal, setEVal] = useState(""); const [eSaving, setESaving] = useState(false);

  async function load() {
    setError("");
    try {
      const [s, ex] = await Promise.all([ api("/cash/"+date, {token}), api("/expenses?from="+date+"&to="+date, {token}) ]);
      setSum(s); setExpenses(ex);
    } catch (e) { setError(firstError(e,"Erro ao carregar.")); setSum(null); }
  }
  useEffect(()=>{ setSum(null); load(); }, [date]);

  async function togglePaid(cid) {
    try { const r = await api("/cash/"+date+"/toggle-paid", {method:"POST",token,body:{collaborator_id:cid}}); setSum(r.summary); }
    catch (e) { alert(firstError(e,"Erro.")); }
  }
  async function closeDay() {
    if(!window.confirm("Fechar o caixa deste dia? Isso registra os totais.")) return;
    try { const r = await api("/cash/"+date+"/close", {method:"POST",token}); setSum(r.summary); }
    catch(e){ alert(firstError(e,"Erro ao fechar.")); }
  }
  async function saveExpense() {
    if(!eDesc || eVal==="") return;
    setESaving(true);
    try { await api("/expenses",{method:"POST",token,body:{description:eDesc, value:Number(eVal), spent_on:date}}); setEDesc(""); setEVal(""); setAddExp(false); load(); }
    catch(e){ alert(firstError(e,"Erro ao salvar despesa.")); } finally { setESaving(false); }
  }
  async function removeExpense(id){ if(!window.confirm("Excluir despesa?")) return; try{ await api("/expenses/"+id,{method:"DELETE",token}); load(); }catch(e){ alert(firstError(e,"Erro.")); } }

  const card = (label, value, tone) => (
    <div className="bg-white rounded-xl border border-slate-200 px-3 py-2.5">
      <div className="text-xs text-slate-500">{label}</div>
      <div className={"text-lg font-semibold " + (tone||"text-slate-800")}>{value}</div>
    </div>
  );

  return (
    <div>
      <div className="flex items-center justify-between mb-4 gap-3 flex-wrap">
        <h2 className="text-lg font-semibold text-slate-800">Caixa do dia</h2>
        <input type="date" value={date} onChange={(e)=>setDate(e.target.value)} className={inputCls+" w-auto"} />
      </div>
      {error && <div className="bg-red-50 text-red-700 text-sm rounded-lg px-3 py-2 mb-4">{error}</div>}
      {sum===null ? <div className="text-slate-400 text-sm">Carregando...</div> : (
        <div className="space-y-4">
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
            {card("Faturamento", brl(sum.gross))}
            {card("Despesas", brl(sum.expenses_total))}
            {card("Comissões", brl(sum.collaborators_total))}
            {card("Líquido", brl(sum.net), sum.net>=0 ? "text-emerald-600" : "text-red-600")}
          </div>
          <div className="text-xs text-slate-400">{sum.services_count} serviço(s) concluído(s) neste dia{sum.closed ? " " + String.fromCharCode(183) + " caixa fechado" : ""}</div>

          <div className="bg-white rounded-2xl border border-slate-200">
            <div className="px-4 py-3 border-b border-slate-100 text-sm font-semibold text-slate-700">Comissões do dia</div>
            <div className="divide-y divide-slate-100">
              {sum.collaborators.length===0 && <div className="px-4 py-6 text-center text-sm text-slate-400">Nenhuma comissão neste dia.</div>}
              {sum.collaborators.map((c,ix)=>(
                <div key={ix} className="flex items-center gap-3 px-4 py-3">
                  <div className="flex-1"><div className="text-sm text-slate-800">{c.name}</div><div className="text-xs text-slate-400">{c.count} serviço(s)</div></div>
                  <div className="text-sm text-slate-700">{brl(c.earning)}</div>
                  {c.collaborator_id ? (
                    <label className="flex items-center gap-1.5 text-xs text-slate-500 cursor-pointer">
                      <input type="checkbox" checked={c.paid} onChange={()=>togglePaid(c.collaborator_id)} /> pago
                    </label>
                  ) : <span className="w-12"></span>}
                </div>
              ))}
            </div>
          </div>

          <div className="bg-white rounded-2xl border border-slate-200">
            <div className="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
              <span className="text-sm font-semibold text-slate-700">Despesas do dia</span>
              <button onClick={()=>setAddExp(!addExp)} className="text-sm text-blue-600 hover:underline">+ Adicionar</button>
            </div>
            {addExp && (
              <div className="px-4 py-3 border-b border-slate-100 flex flex-wrap items-end gap-2">
                <div className="flex-1 min-w-[140px]"><label className="block text-xs text-slate-500 mb-1">Descrição</label>
                  <input value={eDesc} onChange={(e)=>setEDesc(e.target.value)} className={inputCls} /></div>
                <div className="w-28"><label className="block text-xs text-slate-500 mb-1">Valor</label>
                  <CurrencyInput value={eVal} onChange={setEVal} className={inputCls} /></div>
                <button onClick={saveExpense} disabled={eSaving||!eDesc||eVal===""} className={btnPrimary}>Salvar</button>
              </div>
            )}
            <div className="divide-y divide-slate-100">
              {expenses.length===0 && <div className="px-4 py-6 text-center text-sm text-slate-400">Nenhuma despesa neste dia.</div>}
              {expenses.map(x=>(
                <div key={x.id} className="flex items-center gap-3 px-4 py-3">
                  <div className="flex-1 text-sm text-slate-700">{x.description}</div>
                  <div className="text-sm text-red-600">- {brl(x.value)}</div>
                  <button onClick={()=>removeExpense(x.id)} className="text-xs text-red-600 hover:underline">Excluir</button>
                </div>
              ))}
            </div>
          </div>

          <div className="flex justify-end">
            <button onClick={closeDay} className={btnPrimary}>{sum.closed ? "Refechar caixa do dia" : "Fechar caixa do dia"}</button>
          </div>
        </div>
      )}
    </div>
  );
}

  const [date, setDate] = useState(todayStr());

  async function pay(){
    if(amount==="" || Number(amount)<=0){ setError("Informe um valor."); return; }
    setSaving(true); setError("");
    try{ await api("/payments",{method:"POST",token,body:{collaborator_id:row.collaborator_id, amount:Number(amount), paid_on:date}}); onDone(); }
    catch(e){ setError(firstError(e,"Erro ao registrar.")); setSaving(false); }
  }
  return (
    <Modal title={"Pagar " + row.name} onClose={onClose}>

      <input type="date" value={date} onChange={(e)=>setDate(e.target.value)} className={inputCls+" mb-6"} />
      <div className="flex justify-end gap-2">
        <button onClick={onClose} className={btnGhost}>Cancelar</button>
        <button onClick={pay} disabled={saving} className={btnPrimary}>{saving ? "Salvando..." : "Confirmar pagamento"}</button>
      </div>
    </Modal>
  );
}

  useEffect(()=>{ load(); }, []);
  async function remove(u){ if(!window.confirm('Excluir o usuário "'+u.name+'"?')) return; try{ await api("/users/"+u.id,{method:"DELETE",token}); load(); }catch(e){ alert(firstError(e,"Erro ao excluir.")); } }
  if(list===null) return <div className="text-slate-400 text-sm">Carregando...</div>;
  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <h2 className="text-lg font-semibold text-slate-800">Usuários</h2>
        <button onClick={()=>setEditing("new")} className={btnPrimary}>+ Novo</button>
      </div>
      {error && <div className="bg-red-50 text-red-700 text-sm rounded-lg px-3 py-2 mb-4">{error}</div>}
      <div className="bg-white rounded-2xl border border-slate-200 divide-y divide-slate-100">
        {list.length===0 && <div className="px-4 py-10 text-center text-sm text-slate-400">Nenhum usuário.</div>}
        {list.map(u=>(
          <div key={u.id} className="flex items-center gap-3 px-4 py-3">
            <div className="flex-1 min-w-0">
              <div className="text-sm font-medium text-slate-800">{u.name}{u.id===user.id ? " (você)" : ""}</div>
              <div className="text-xs text-slate-400">@{u.username}</div>
            </div>
            <span className={"text-xs px-2 py-0.5 rounded-full " + (u.role==="admin" ? "bg-blue-50 text-blue-700" : "bg-slate-100 text-slate-600")}>{u.role==="admin" ? "Administrador" : "Colaborador"}</span>
            <button onClick={()=>setEditing(u)} className="text-sm text-blue-600 hover:underline">Editar</button>
            {u.id!==user.id && <button onClick={()=>remove(u)} className="text-sm text-red-600 hover:underline">Excluir</button>}
          </div>
        ))}
      </div>
      {editing && <UsuarioForm token={token} usuario={editing==="new"?null:editing} onClose={()=>setEditing(null)} onSaved={()=>{ setEditing(null); load(); }} />}
    </div>
  );
}

function UsuarioForm({ token, usuario, onClose, onSaved }) {
  const [name, setName] = useState(usuario?usuario.name:"");
  const [username, setUsername] = useState(usuario?usuario.username:"");
  const [password, setPassword] = useState("");
  const [role, setRole] = useState(usuario?usuario.role:"colaborador");
  const [saving, setSaving] = useState(false); const [error, setError] = useState("");
  async function save(){
    if(!usuario && !password){ setError("Defina uma senha."); return; }
    setError(""); setSaving(true);
    const body = { name, username, role }; if(password) body.password = password;
    try{ if(usuario) await api("/users/"+usuario.id,{method:"PUT",token,body}); else await api("/users",{method:"POST",token,body}); onSaved(); }
    catch(e){ setError(firstError(e,"Erro ao salvar.")); setSaving(false); }
  }
  return (
    <Modal title={usuario?"Editar usuário":"Novo usuário"} onClose={onClose}>
      {error && <div className="bg-red-50 text-red-700 text-sm rounded-lg px-3 py-2 mb-4">{error}</div>}
      <label className="block text-sm text-slate-600 mb-1.5">Nome</label>
      <input value={name} onChange={(e)=>setName(e.target.value)} autoFocus className={inputCls+" mb-4"} />
      <label className="block text-sm text-slate-600 mb-1.5">Usuário (login)</label>
      <input value={username} onChange={(e)=>setUsername(e.target.value.toLowerCase().replace(/\s/g,""))} className={inputCls+" mb-4"} />
      <label className="block text-sm text-slate-600 mb-1.5">{usuario ? "Nova senha (vazio p/ manter)" : "Senha"}</label>
      <input type="password" value={password} onChange={(e)=>setPassword(e.target.value)} className={inputCls+" mb-4"} />
      <label className="block text-sm text-slate-600 mb-1.5">Tipo de acesso</label>
      <select value={role} onChange={(e)=>setRole(e.target.value)} className={inputCls+" mb-2 bg-white"}>
        <option value="colaborador">Colaborador</option>
        <option value="admin">Administrador</option>
      </select>
      <p className="text-xs text-slate-400 mb-6">{role==="admin" ? "Acesso a tudo (cadastros, financeiro, relatórios)." : "Só lança e consulta agendamentos."}</p>
      <div className="flex justify-end gap-2">
        <button onClick={onClose} className={btnGhost}>Cancelar</button>
        <button onClick={save} disabled={saving || !name || !username} className={btnPrimary}>{saving?"Salvando...":"Salvar"}</button>
      </div>
    </Modal>
  );
}

function Configuracoes({ token, user }) {
  const [data, setData] = useState(null); const [error, setError] = useState(""); const [saving, setSaving] = useState(false); const [saved, setSaved] = useState(false);
  useEffect(()=>{ api("/settings",{token}).then(setData).catch(e=>setError(firstError(e,"Erro ao carregar."))); }, []);
  function set(k,v){ setData({...data, [k]: v}); setSaved(false); }
  async function save(){
    setSaving(true); setError(""); setSaved(false);
    try{ const r = await api("/settings",{method:"PUT",token,body:{ company_name:data.company_name||"", company_pix:data.company_pix||"", message_scheduling:data.message_scheduling||"", message_rescheduling:data.message_rescheduling||"", message_completion:data.message_completion||"" }}); setData(r); setSaved(true); }
    catch(e){ setError(firstError(e,"Erro ao salvar.")); } finally { setSaving(false); }
  }
  if(!data) return <div className="text-slate-400 text-sm">Carregando...</div>;
  const fld = (label, key, rows, hint) => (
    <div className="mb-4">
      <label className="block text-sm text-slate-600 mb-1.5">{label}</label>
      {rows ? <textarea value={data[key]||""} onChange={(e)=>set(key,e.target.value)} rows={rows} className={inputCls+" resize-none"} />
            : <input value={data[key]||""} onChange={(e)=>set(key,e.target.value)} className={inputCls} />}
      {hint && <p className="text-xs text-slate-400 mt-1">{hint}</p>}
    </div>
  );
  const ph = "Use: {nome} {empresa} {data} {hora} {servico} {valor} {pix}";
  return (
    <div>
      <h2 className="text-lg font-semibold text-slate-800 mb-1">Configurações</h2>
      <p className="text-sm text-slate-500 mb-4">Dados do estabelecimento e mensagens automáticas do WhatsApp.</p>
      {error && <div className="bg-red-50 text-red-700 text-sm rounded-lg px-3 py-2 mb-4">{error}</div>}
      <div className="bg-white rounded-2xl border border-slate-200 p-4 mb-4">
        {fld("Nome do estabelecimento","company_name")}
        {fld("Chave PIX","company_pix",0,"Aparece na mensagem de conclusão ({pix}).")}
      </div>
      <div className="bg-white rounded-2xl border border-slate-200 p-4 mb-4">
        <div className="text-sm font-semibold text-slate-700 mb-1">Mensagens automáticas</div>
        <p className="text-xs text-slate-400 mb-3">{ph}</p>
        {fld("Agendamento","message_scheduling",4)}
        {fld("Remarcação","message_rescheduling",4)}
        {fld("Conclusão","message_completion",4)}
      </div>
      <div className="flex items-center justify-end gap-3 pb-2">
        {saved && <span className="text-sm text-emerald-600">Salvo!</span>}
        <button onClick={save} disabled={saving} className={btnPrimary}>{saving?"Salvando...":"Salvar"}</button>
      </div>
    </div>
  );
}

function App() {
  const [token, setToken] = useState(() => localStorage.getItem(tokenKey));
  const [user, setUser] = useState(null);
  const [booting, setBooting] = useState(!!localStorage.getItem(tokenKey));
  const [page, setPage] = useState("inicio");
  const [newSig, setNewSig] = useState(0);
  const [consumedSig, setConsumedSig] = useState(0);
  useEffect(() => {
    if (token) api("/me", { token }).then((u)=>{ setUser(u); setBooting(false); })
      .catch(()=>{ localStorage.removeItem(tokenKey); setToken(null); setBooting(false); });
  }, []);
  if (!slug) return <NoSlug />;
  if (booting) return <Splash />;
  if (!token || !user) return <Login slug={slug} onLogged={(t,u)=>{ setToken(t); setUser(u); }} />;
  return (
    <Layout user={user} slug={slug} page={page} setPage={setPage} onNew={()=>{ setPage("agendamentos"); setNewSig(n=>n+1); }}
      onLogout={()=>{ api("/logout",{method:"POST",token}).catch(()=>{}); localStorage.removeItem(tokenKey); setToken(null); setUser(null); }}>
      {page==="inicio" && <Inicio token={token} user={user} setPage={setPage} onNew={()=>{ setPage("agendamentos"); setNewSig(n=>n+1); }} />}
      {page==="agendamentos" && <Agendamentos token={token} user={user} newSignal={newSig} lastConsumed={consumedSig} onConsumedNew={setConsumedSig} />}
      {page==="colaboradores" && <Colaboradores token={token} user={user} />}
      {page==="financeiro" && <Financeiro token={token} user={user} />}
      {page==="servicos" && <Servicos token={token} user={user} />}
      {page==="tipos" && <Tipos token={token} user={user} />}
      {page==="mais" && <Mais user={user} setPage={setPage} />}
      {page==="usuarios" && <Usuarios token={token} user={user} />}
      {page==="config" && <Configuracoes token={token} user={user} />}
    </Layout>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
